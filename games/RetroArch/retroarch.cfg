content_history_directory = "/media/fat/games/RetroArch/playlists"
content_history_path = "/media/fat/games/RetroArch/playlists/content_history.lpl"
# Manual save/load are retained; never load an automatic state on launch.
savestate_auto_load = "false"
savestate_auto_save = "false"
savestate_thumbnail_enable = "false"

# Content overrides are used by the optional DOSBox Pure profile only.
auto_overrides_enable = "true"
auto_remaps_enable = "true"
# Per-game RetroArch controls (docs/CONTROLS.md): launch_payload.sh seeds
# remaps/MAME 2003-Plus/<set>.rmp from the shared default before each MAME launch,
# so the game's own file is the loaded remap and changes made in Quick Menu >
# Controls are saved into it when the game closes (owner, 2026-10-22). The shared
# core remap is never the loaded file for a game, so one game cannot change another.
remap_save_on_exit = "true"
game_specific_options = "true"

# Performance / stability / latency tuning (owner order 2026-09-26; host-gated,
# not yet measured on target). input_poll_type_behavior = "2" (late polling)
# is set above. video_frame_delay stays 0: no spare frame time to trade yet.
video_font_enable = "false"
libretro_log_level = "3"
frontend_log_level = "3"
autosave_interval = "0"
cheevos_enable = "false"
network_cmd_enable = "false"
stdin_cmd_enable = "false"
# Cheaper sinc resampler (0 lowest, 1 lower, 2 normal). Changes output audio:
# the audio gate must be rerun before this is released.
audio_resampler_quality = "1"
