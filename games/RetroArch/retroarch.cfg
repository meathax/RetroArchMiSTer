# Step14 lightweight RGUI; controller profile unchanged. Requires our Frontier video/audio/input/joypad drivers.
# This is NOT a configuration for stock desktop RetroArch or a working RBF.
video_driver = "frontier"
audio_driver = "frontier"
input_driver = "frontier"
input_joypad_driver = "frontier"
menu_driver = "rgui"
video_threaded = "false"
video_vsync = "true"
video_smooth = "false"
video_shader_enable = "false"
video_frame_delay = "0"
# Generic native-geometry passthrough (every FBNeo game, not just one title):
# the Frontier video driver's frame callback receives each core's raw
# video_cb buffer untouched and its poke_interface leaves set_viewport as a
# no-op, so these are belt-and-suspenders against a future viewport-honouring
# driver change, not a currently load-bearing fix. No forced aspect ratio, no
# integer-scale snapping, no overscan crop: the core's own geometry (from
# av_info / SET_GEOMETRY / SET_SYSTEM_AV_INFO) is what reaches frontier_gfx.c.
video_aspect_ratio_auto = "true"
video_scale_integer = "false"
video_crop_overscan = "false"
audio_enable = "true"
audio_sync = "true"
audio_out_rate = "48000"
audio_latency = "32"
rewind_enable = "false"
run_ahead_enabled = "false"
preemptive_frames_enable = "false"
config_save_on_exit = "false"
input_max_users = "4"
input_poll_type_behavior = "2"
input_menu_toggle = "f1"
menu_pause_libretro = "true"
menu_show_online_updater = "false"
log_verbosity = "false"
libretro_directory = "/media/fat/games/RetroArch/cores"
system_directory = "/media/fat/games/RetroArch/system"
savefile_directory = "/media/fat/games/RetroArch/saves"
savestate_directory = "/media/fat/games/RetroArch/states"
rgui_browser_directory = "/media/fat/games/RetroArch/roms"
core_options_path = "/media/fat/games/RetroArch/config/retroarch-core-options.cfg"

# Native, opaque RGUI: no particle work, thumbnails, music, mouse or widgets.
video_refresh_rate = "60.000000"
menu_throttle_framerate = "true"
rgui_show_start_screen = "false"
rgui_particle_effect = "0"
rgui_internal_upscale_level = "0"
menu_enable_widgets = "false"
menu_thumbnails = "0"
